services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: barber
      DB_USERNAME: barber
      DB_PASSWORD: barber
    
    volumes:
      - ./:/app



  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: barber
      MYSQL_USER: barber
      MYSQL_PASSWORD: barber
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
